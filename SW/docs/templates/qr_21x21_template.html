<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seedmate QR Code 21x21 Template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    .no-print {
      margin-bottom: 20px; text-align: center;
      background: white; padding: 12px 24px; border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    button {
      background-color: #0070f3; color: white; border: none;
      padding: 10px 20px; font-size: 15px; border-radius: 6px;
      cursor: pointer; font-weight: bold;
    }
    button:hover { background-color: #0051cb; }
    .page {
      background-color: white; width: 210mm; height: 297mm;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex; justify-content: center; align-items: center;
    }
    svg { width: 100%; height: 100%; }
    @media print {
      body { background-color: white; padding: 0; margin: 0; }
      .no-print { display: none; }
      .page { box-shadow: none; width: 100%; height: 100%; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <h3 style="margin:0 0 5px 0;">Seedmate QR Code Template</h3>
    <p style="margin:0 0 10px 0; color:#666; font-size:14px;">Open this file in your browser and print to A4 or export to PDF.</p>
    <button onclick="window.print()">Print / Save PDF</button>
  </div>
  <div class="page">
    <img src="qr_21x21_template.svg" alt="Seedmate QR Code 21x21 Template">
  </div>
</body>
</html>
